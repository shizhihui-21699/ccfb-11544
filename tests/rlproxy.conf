# rlproxy test configuration
listen    127.0.0.1:18080
upstream  127.0.0.1:19000
token_header X-User-Token
trust_xff on
max_conns 20000
idle_timeout_ms 30000
head_timeout_ms 8000
stats_interval_s 5

# Per-IP: token bucket, 20 req/s sustained, burst of 40
zone ip_fast type=ip key=$ip alg=token_bucket rate=20/s burst=40

# Per-user token: sliding window log, 300 requests per minute
zone user_quota type=token key=$token alg=sliding_log rate=300/m

# Anonymous users share a tight bucket (no token header)
zone anon_quota type=token key=anon alg=token_bucket rate=10/s burst=20

# Expensive admin route, hard ceiling regardless of caller
zone route_admin type=route key=/admin alg=sliding_log rate=5/s

# General API route aggregate
zone route_api type=route key=/api alg=token_bucket rate=500/s burst=1000
