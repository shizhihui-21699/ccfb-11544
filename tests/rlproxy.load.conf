# rlproxy load-test configuration
# Layered defense, tuned for the replay/attack scenarios in tests/.
listen    127.0.0.1:18080
upstream  127.0.0.1:19000
token_header X-User-Token
trust_xff on
max_conns 20000
idle_timeout_ms 30000
head_timeout_ms 8000
stats_interval_s 0

# Layer 1 — per source IP. Token bucket absorbs short bursts while
# holding sustained load at 30 rps. This is the primary flood defense.
zone ip_fast type=ip key=$ip alg=token_bucket rate=30/s burst=60

# Layer 2 — authenticated users get a generous per-minute budget.
# Sliding window log gives an exact, smooth ceiling with no bucket
# credit hoarding.
zone user_quota type=token key=$token alg=sliding_log rate=600/m

# Layer 2b — anonymous callers are limited per IP (key=$ip), not in one
# global bucket, otherwise one key is shared by every unauthenticated
# caller and the zone becomes a single point of collapse.
zone anon_per_ip type=ip key=$ip alg=token_bucket rate=15/s burst=30

# Layer 3a — expensive admin surface, hard exact ceiling.
zone route_admin type=route key=/admin alg=sliding_log rate=10/s

# Layer 3b — aggregate API throughput ceiling.
zone route_api type=route key=/api alg=token_bucket rate=2000/s burst=4000
