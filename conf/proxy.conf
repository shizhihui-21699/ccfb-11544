# rlproxy configuration
# Reload with: kill -HUP <pid>   (limits/upstream/listen apply live, no connection dropped)
#
# 以下默认值经 rlreplay 压测调定（见 README「压测调参记录」）：
#  - 5000 rps 冲击下代理 CPU <5%，p99.9 延迟 0ms，上游只见放行流量
#  - burst = 2x rate：1s 200rps 突发可吸收 ~57%，滑动窗口则硬顶
#  - header_timeout 10s：300 个慢连接全部按时掐死，正常流量 100% 放行

listen 127.0.0.1:8080
upstream 127.0.0.1:9000

max_conns 10000
# 慢连接攻击防护：一个请求的头部必须在该预算内发完，超时掐连接
header_timeout_ms 10000
idle_timeout_ms 60000

# 第一层：按客户端 IP。令牌桶，容忍突发（NAT 后大量用户共享 IP，硬顶误伤大）。
limit ip {
  algorithm token_bucket
  rate 100        # 平均 100 req/s
  burst 200       # 允许 2s 均值规模的突发
}

# 第二层：按用户令牌（Authorization: Bearer / X-Api-Key）。
# 滑动窗口日志，严格配额、不容忍突发——API key 按配额计费时不该有"桶底余量"。
limit token {
  algorithm sliding_window
  limit 1000
  window_ms 60000
}

# 第三层：按路由聚合限流（最长前缀匹配），保护下游贵接口。
route /api/heavy {
  algorithm token_bucket
  rate 20
  burst 40
}

route /api {
  algorithm sliding_window
  limit 600
  window_ms 60000
}
